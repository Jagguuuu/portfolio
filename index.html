    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply stored theme before paint to avoid flash -->
    <script>
      try {
        var t = localStorage.getItem('jd-theme')
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
